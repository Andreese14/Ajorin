<title>FAQ — Ajorin</title>
<meta name="description" content="Frequently asked questions about Ajorin, the personalized discovery platform." />

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink:#0B0B0F; --paper:#F7F4EE; --terra:#474787; --gold:#B8963E;
  --mist:#E2DDD5; --fog:#9E9A93; --white:#FFFFFF;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',monospace;
}
html { scroll-behavior: smooth; }
body { background:var(--ink); color:var(--white); font-family:var(--sans); font-size:16px; line-height:1.6; }

nav {
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  padding:1.2rem 2.5rem; background:rgba(11,11,15,0.85);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.nav-logo-group { display:flex; flex-direction:column; gap:0.35rem; max-width:70vw; }
.nav-sublinks { display:flex; flex-wrap:wrap; align-items:center; gap:0.4rem 0.6rem; font-family:var(--mono); font-size:0.6rem; letter-spacing:0.08em; text-transform:uppercase; }
.nav-sublinks a { color:rgba(255,255,255,0.5); text-decoration:none; transition:color 0.2s; white-space:nowrap; }
.nav-sublinks a:hover { color:var(--terra); }
.nav-sublinks span { color:rgba(255,255,255,0.2); }

.nav-logo { font-family:var(--serif); font-size:1.65rem; font-weight:600; letter-spacing:0.06em; color:var(--white); text-decoration:none; line-height:1; }
.nav-logo span { color:var(--terra); }
.nav-sublinks { display:flex; align-items:center; gap:0.5rem; font-family:var(--mono); font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; }
.nav-sublinks a { color:rgba(255,255,255,0.5); text-decoration:none; transition:color 0.2s; }
.nav-sublinks a.current, .nav-sublinks a:hover { color:var(--terra); }
.nav-sublinks span { color:rgba(255,255,255,0.25); }
.nav-cta { font-family:var(--sans); font-size:0.75rem; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--white); background:var(--terra); padding:0.65rem 1.5rem; border-radius:2px; text-decoration:none; transition:background 0.2s; }
.nav-cta:hover { background:#3a3a70; }

.page-hero {
  min-height:42vh; background:var(--ink); display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:9rem 2rem 4rem; position:relative; overflow:hidden;
  background-size:cover; background-position:center;
}
.page-hero-overlay {
  position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(11,11,15,0.65) 0%, rgba(11,11,15,0.45) 50%, rgba(11,11,15,0.85) 100%);
}
.page-eyebrow { position:relative; z-index:2; font-family:var(--mono); font-size:0.68rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--terra); margin-bottom:1.5rem; text-shadow:0 2px 12px rgba(0,0,0,0.7); }
.page-title { position:relative; z-index:2; font-family:var(--serif); font-size:clamp(2.6rem,6vw,4.5rem); font-weight:300; color:var(--white); line-height:1.1; text-shadow:0 4px 24px rgba(0,0,0,0.65), 0 2px 8px rgba(0,0,0,0.6); }

.faq-wrap { max-width:720px; margin:0 auto; padding:4.5rem 2rem 6rem; }

.faq-item {
  border-bottom:1px solid rgba(255,255,255,0.12);
}
.faq-question {
  width:100%; text-align:left; background:none; border:none; cursor:pointer;
  padding:1.7rem 0; display:flex; align-items:center; justify-content:space-between; gap:1rem;
  font-family:var(--serif); font-size:clamp(1.1rem,2vw,1.35rem); color:var(--white); font-weight:400;
  transition:color 0.2s;
}
.faq-question:hover { color:var(--terra); }
.faq-icon {
  flex-shrink:0; width:26px; height:26px; border-radius:50%; border:1px solid rgba(255,255,255,0.25);
  display:flex; align-items:center; justify-content:center; position:relative; transition:all 0.3s ease;
}
.faq-icon::before, .faq-icon::after {
  content:''; position:absolute; background:var(--terra); transition:transform 0.3s ease;
}
.faq-icon::before { width:10px; height:1.5px; }
.faq-icon::after { width:1.5px; height:10px; }
.faq-item.open .faq-icon::after { transform:rotate(90deg) scaleY(0); }
.faq-item.open .faq-icon { border-color:var(--terra); background:var(--terra); }
.faq-item.open .faq-icon::before, .faq-item.open .faq-icon::after { background:var(--white); }

.faq-answer {
  max-height:0; overflow:hidden; transition:max-height 0.4s ease, padding 0.4s ease;
  font-size:0.98rem; color:rgba(255,255,255,0.65); line-height:1.9;
}
.faq-item.open .faq-answer { padding-bottom:1.7rem; }
.faq-answer p { max-width:600px; }
.faq-answer strong { color:var(--terra); font-weight:600; }

.faq-cta { text-align:center; margin-top:4rem; padding-top:3.5rem; border-top:1px solid rgba(255,255,255,0.12); }
.faq-cta-title { font-family:var(--serif); font-size:clamp(1.6rem,4vw,2.4rem); font-weight:300; font-style:italic; color:var(--terra); margin-bottom:1.5rem; }
.btn-primary { font-family:var(--sans); font-size:0.8rem; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--white); background:var(--terra); padding:1rem 2.5rem; border:none; border-radius:2px; cursor:pointer; text-decoration:none; transition:background 0.2s, transform 0.15s; display:inline-block; }
.btn-primary:hover { background:#3a3a70; transform:translateY(-1px); }

footer { padding:2.5rem 2.5rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; border-top:1px solid rgba(255,255,255,0.12); background:var(--ink); }
.footer-logo { font-family:var(--serif); font-size:1.3rem; font-weight:600; letter-spacing:0.05em; color:var(--white); }
.footer-logo span { color:var(--terra); }
.footer-tag { font-family:var(--mono); font-size:0.6rem; letter-spacing:0.14em; color:rgba(255,255,255,0.5); text-transform:uppercase; margin-top:0.2rem; }
.footer-links { display:flex; gap:1.5rem; }
.footer-links a { font-size:0.8rem; color:rgba(255,255,255,0.5); text-decoration:none; transition:color 0.2s; }
.footer-links a:hover { color:var(--terra); }

@media (max-width:640px) {
  nav { padding:1rem 1.1rem; }
  .nav-cta { padding:0.55rem 1.1rem; font-size:0.68rem; letter-spacing:0.08em; }
  .nav-logo { font-size:1.4rem; }
  nav { padding:1rem 1.25rem; }
  .page-hero { padding:7rem 1.25rem 3rem; }
  .faq-wrap { padding:3rem 1.25rem 4rem; }
  footer { flex-direction:column; align-items:flex-start; }
}
</style>

</section>

<div class="faq-wrap" id="faqWrap"></div>

<footer>
  <div>
    <div class="footer-logo">Ajor<span>in</span></div>
    <div class="footer-tag">See the world in your own way</div>
  </div>
  <div class="footer-links">
    <a href="about.html">About</a>
    <a href="features.html">Features</a>
    <a href="how-it-works.html">How It Works</a>
    <a href="faq.html">FAQ</a>
    <a href="mailto:hello@ajorin.com">hello@ajorin.com</a>
  </div>
</footer>

<script>
const faqs = [
  {
    q: "What is Ajorin?",
    a: "Ajorin is a personalized discovery platform that helps you find experiences tailored to who you are. Instead of showing everyone the same popular places, Ajorin recommends places, activities, and experiences based on your interests, preferences, and context."
  },
  {
    q: "How is Ajorin different from other travel apps?",
    a: "Most discovery platforms begin with a destination. <strong>Ajorin begins with you.</strong> We learn what you enjoy, how you like to explore, and what makes an experience meaningful to you. Every recommendation is personalized rather than simply ranked by popularity."
  },
  {
    q: "Is Ajorin only for travelers?",
    a: "No. Ajorin is designed for anyone looking to discover something new — whether you're visiting another country, exploring your hometown, moving to a new city, or simply searching for your next favorite place."
  },
  {
    q: "How does Ajorin personalize recommendations?",
    a: "Ajorin starts by learning about your interests and preferences during onboarding. As you use the platform, it continues learning from your interactions, helping recommendations become more accurate over time."
  },
  {
    q: "Do I need to answer questions every time I use the app?",
    a: "No. Your profile evolves naturally as you use Ajorin. You'll only be asked occasional questions when they help improve your recommendations or reflect changes in your preferences."
  },
  {
    q: "What kinds of places can Ajorin recommend?",
    a: "Depending on your interests, Ajorin can recommend restaurants, cafés, parks, museums, bookstores, live music, cultural attractions, hiking trails, events, neighborhoods, hidden gems, and much more."
  },
  {
    q: "Does Ajorin only recommend popular places?",
    a: "No. Popularity is only one signal. We also prioritize places that match your interests, helping you discover experiences that feel personally relevant — even if they're lesser known."
  },
  {
    q: "Can I share my discoveries?",
    a: "Yes. Ajorin makes it easy to share your personalized discoveries with friends, while still allowing them to receive recommendations tailored to their own tastes."
  },
  {
    q: "Is my personal information private?",
    a: "Your preferences belong to you. Ajorin uses your profile to improve your recommendations and is committed to protecting your privacy and giving you control over your data."
  },
  {
    q: "Why the name Ajorin?",
    a: "Ajorin is inspired by the Yoruba name <em>Anjorin</em>, which conveys the idea of walking a journey together. It reflects our belief that discovering somewhere new should never feel like you're walking alone."
  }
];

const wrap = document.getElementById('faqWrap');
faqs.forEach((item, i) => {
  const el = document.createElement('div');
  el.className = 'faq-item';
  el.innerHTML = `
    <button class="faq-question" onclick="toggleFaq(${i})">
      <span>${item.q}</span>
      <span class="faq-icon"></span>
    </button>
    <div class="faq-answer" id="faq-answer-${i}"><p>${item.a}</p></div>
  `;
  wrap.appendChild(el);
});

const ctaBlock = document.createElement('div');
ctaBlock.className = 'faq-cta';
ctaBlock.innerHTML = `
  <p class="faq-cta-title">Still have questions?</p>
  <a href="mailto:hello@ajorin.com" class="btn-primary">Get in Touch</a>
`;
wrap.appendChild(ctaBlock);

function toggleFaq(i) {
  const items = document.querySelectorAll('.faq-item');
  const item = items[i];
  const answer = document.getElementById(`faq-answer-${i}`);
  const isOpen = item.classList.contains('open');

  // Close all
  items.forEach((it, idx) => {
    it.classList.remove('open');
    document.getElementById(`faq-answer-${idx}`).style.maxHeight = null;
  });

  // Open clicked one if it wasn't already open
  if (!isOpen) {
    item.classList.add('open');
    answer.style.maxHeight = answer.scrollHeight + 40 + 'px';
  }
}
</script>
</body>
</html>
