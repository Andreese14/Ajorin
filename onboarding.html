<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Get Started — Ajorin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0B0B0F; --terra:#5C5CA8; --gold:#B8963E; --mist:rgba(255,255,255,0.15); --fog:rgba(255,255,255,0.55); --white:#FFFFFF;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',monospace;
}
body{font-family:var(--sans);background:var(--ink);color:var(--white);font-size:16px;height:100vh;overflow:hidden;position:relative}
.bg-photo{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(18px) brightness(0.35);transform:scale(1.1);z-index:0}

.top-bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:0.9rem 1.2rem}
.top-logo{font-family:var(--serif);font-size:1.15rem;font-weight:600}
.top-logo span{color:var(--terra)}
.signin-link{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--fog);background:none;border:1px solid var(--mist);padding:0.4rem 0.8rem;border-radius:20px;cursor:pointer}

.vibe-badge{position:fixed;top:3rem;left:50%;transform:translateX(-50%);background:rgba(184,150,62,0.15);border:1px solid rgba(184,150,62,0.4);backdrop-filter:blur(8px);border-radius:20px;padding:0.4rem 1rem;font-family:var(--mono);font-size:0.6rem;letter-spacing:0.04em;color:var(--gold);z-index:20;transition:all 0.3s ease;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}

.chat-wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding-top:5.6rem}
.chat-scroll{flex:1;overflow-y:auto;padding:0 1.2rem 1rem;display:flex;flex-direction:column;gap:0.9rem}

.msg{max-width:82%;padding:0.8rem 1rem;border-radius:18px;font-size:0.92rem;line-height:1.45;animation:pop 0.25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-ajorin{align-self:flex-start;background:rgba(255,255,255,0.08);border:1px solid var(--mist);border-bottom-left-radius:4px}
.msg-ajorin .msg-name{font-family:var(--mono);font-size:0.55rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--terra);margin-bottom:0.3rem;display:block}
.msg-you{align-self:flex-end;background:var(--terra);border-bottom-right-radius:4px}

.typing{align-self:flex-start;display:flex;gap:0.3rem;padding:0.9rem 1.1rem;background:rgba(255,255,255,0.08);border-radius:18px;border-bottom-left-radius:4px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--fog);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,80%,100%{opacity:0.2}40%{opacity:1}}

.quick-replies{display:flex;flex-direction:column;gap:0.7rem;padding:0 1.2rem calc(2.2rem + env(safe-area-inset-bottom, 0px));position:relative;z-index:1}
.qr-pill-row{display:flex;flex-wrap:wrap;gap:0.5rem}
.qr-action-row{display:flex;justify-content:flex-end;gap:0.6rem;padding-top:0.2rem;border-top:1px solid var(--mist)}
.qr-pill{font-family:var(--sans);font-size:0.82rem;padding:0.6rem 1.1rem;border-radius:20px;border:1.5px solid var(--terra);background:rgba(92,92,168,0.12);color:#fff;cursor:pointer;transition:all 0.15s}
.qr-pill:hover{background:var(--terra)}
.qr-pill.selected{background:var(--terra)}
.qr-confirm{font-family:var(--sans);font-size:0.82rem;font-weight:600;padding:0.6rem 1.2rem;border-radius:20px;border:none;background:var(--gold);color:#181818;cursor:pointer}
.qr-skip{font-family:var(--mono);font-size:0.68rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--fog);background:none;border:1px solid var(--mist);padding:0.6rem 1rem;border-radius:20px;cursor:pointer}

.other-box{display:flex;gap:0.5rem;width:100%;margin-top:0.3rem}
.other-input{flex:1;padding:0.6rem 0.9rem;border-radius:20px;border:1px solid var(--terra);background:rgba(92,92,168,0.1);color:#fff;font-family:var(--sans);font-size:0.82rem}
.other-add{background:var(--terra);color:#fff;border:none;border-radius:20px;padding:0.6rem 1rem;font-size:0.78rem;cursor:pointer}

.form-box{background:rgba(255,255,255,0.06);border:1px solid var(--mist);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:0.6rem;width:100%}
.form-input{padding:0.7rem 0.9rem;border-radius:8px;border:1px solid var(--mist);background:rgba(255,255,255,0.05);color:#fff;font-family:var(--sans);font-size:0.85rem}
.form-input::placeholder{color:var(--fog)}
.form-submit{background:var(--terra);color:#fff;border:none;border-radius:8px;padding:0.75rem;font-family:var(--sans);font-weight:600;font-size:0.85rem;cursor:pointer;margin-top:0.3rem}
.form-error{color:#e88;font-size:0.75rem;display:none}

.blend-row{display:flex;gap:0.6rem;flex-wrap:wrap;width:100%}
.blend-chip{background:rgba(184,150,62,0.15);border:1px solid rgba(184,150,62,0.4);border-radius:12px;padding:0.6rem 0.9rem;text-align:center;flex:1;min-width:100px}
.blend-emoji{font-size:1.3rem;display:block}
.blend-lbl{font-size:0.72rem;color:var(--gold);margin-top:0.2rem}

.final-btn{background:var(--terra);color:#fff;border:none;border-radius:20px;padding:0.75rem 1.5rem;font-family:var(--sans);font-weight:600;font-size:0.85rem;cursor:pointer;text-decoration:none;display:inline-block}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:30;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.overlay-box{background:var(--ink);border:1px solid var(--mist);border-radius:16px;padding:1.8rem 1.5rem;max-width:360px;width:100%}
.overlay-title{font-family:var(--serif);font-size:1.3rem;font-style:italic;margin-bottom:1rem;text-align:center}
.overlay-close{display:block;text-align:center;margin-top:0.8rem;font-family:var(--mono);font-size:0.65rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--fog);background:none;border:none;cursor:pointer;width:100%}
</style>
</head>
<body>

<div class="bg-photo" id="bgPhoto"></div>

<div class="top-bar">
  <div class="top-logo">Ajor<span>in</span></div>
  <button class="signin-link" id="signinToggle" onclick="showSigninOverlay()">Sign In</button>
</div>

<div class="vibe-badge" id="vibeBadge">🌍 Your Vibe So Far: Getting to know you...</div>

<div class="chat-wrap">

  <div class="quick-replies" id="quickReplies"></div>
</div>

const chatScroll = document.getElementById('chatScroll');

// Waits a frame for layout (new messages, quick-reply buttons, etc.) to actually
// settle before scrolling — fixes the chat not moving up reliably on tap.
function scrollChatToBottom() {
  requestAnimationFrame(() => {
    chatScroll.scrollTo({ top: chatScroll.scrollHeight, behavior: 'smooth' });
    // Fallback in case smooth-scroll doesn't fully land (e.g. mid-animation on fast taps)
    setTimeout(() => { chatScroll.scrollTop = chatScroll.scrollHeight; }, 250);
  });
}

function updateVibe() {
  const matched = vibeMap.filter(v => v.match.some(m => selections.includes(m)));
  if (matched.length === 0) { vibeBadge.textContent = '🌍 Your Vibe So Far: Getting to know you...'; return; }
  const latest = matched[matched.length - 1];
  vibeBadge.textContent = `${latest.emoji} Your Vibe So Far: ${latest.label}`;
}

function addAjorinMessage(text, cb, delay = 700) {
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  chatScroll.appendChild(typing);
  scrollChatToBottom();
  setTimeout(() => {
    typing.remove();
    const msg = document.createElement('div');
    msg.className = 'msg msg-ajorin';
    msg.innerHTML = `<span class="msg-name">Ajorin</span>${text}`;
    chatScroll.appendChild(msg);
    scrollChatToBottom();
    if (cb) cb();
  }, delay);
}

function addYouMessage(text) {
  const msg = document.createElement('div');
  msg.className = 'msg msg-you';
  msg.textContent = text;
  chatScroll.appendChild(msg);
  scrollChatToBottom();
}

        box.className = 'other-box';
        box.id = 'otherBox';
        box.innerHTML = `<input class="other-input" id="otherInput" placeholder="Tell us more..."><button class="other-add">Add</button>`;
        pillRow.appendChild(box);
        scrollChatToBottom();
        box.querySelector('.other-add').onclick = () => {
          const val = document.getElementById('otherInput').value.trim();
          if (val) { currentMultiSelections.push(val); btn.classList.add('selected'); btn.textContent = val; }
          box.remove();
        };
        return;
      }
      if (q.multi) {
        btn.classList.toggle('selected');
        if (btn.classList.contains('selected')) currentMultiSelections.push(opt);
        else currentMultiSelections = currentMultiSelections.filter(s => s !== opt);
      } else {
        selectAnswer([opt]);
      }
    };
    pillRow.appendChild(btn);
  });

  if (q.multi || q.skippable) {
    const actionRow = document.createElement('div');
    actionRow.className = 'qr-action-row';
    quickReplies.appendChild(actionRow);

    if (q.skippable) {
      const skipBtn = document.createElement('button');
      skipBtn.className = 'qr-skip';
      skipBtn.textContent = 'Skip';
      skipBtn.onclick = () => selectAnswer(['Skipped']);
      actionRow.appendChild(skipBtn);
    }

    if (q.multi) {
      const confirmBtn = document.createElement('button');
      confirmBtn.className = 'qr-confirm';
      confirmBtn.textContent = 'Done →';
      confirmBtn.onclick = () => selectAnswer(currentMultiSelections.length ? currentMultiSelections : ['None']);
      actionRow.appendChild(confirmBtn);
    }
  }

  scrollChatToBottom();
}

const funnyAcks = [
  "Noted.", "Got it — filing that away.", "Okay, I see you.", "Love that for you.",
  "Interesting. In a good way.", "Duly noted.", "I'm building a whole file on you right now."
];

function selectAnswer(answers) {
  quickReplies.innerHTML = '';
  addYouMessage(answers.join(', '));
  selections.push(...answers);
  answersByField[questions[step].field] = answers.join(', ');
  updateVibe();

  step++;
  if (step < questions.length) {
    const ack = funnyAcks[Math.floor(Math.random() * funnyAcks.length)];
    setTimeout(() => addAjorinMessage(`${ack} ${questions[step].text}`, () => renderQuickReplies(questions[step])), 400);
  } else {
    setTimeout(showBlend, 400);
  }
}

function computeBlend() {
  const matched = vibeMap.filter(v => v.match.some(m => selections.includes(m)));
  const seen = new Set();
  const unique = matched.filter(v => !seen.has(v.label) && seen.add(v.label));
  return unique.slice(0, 4).length > 0 ? unique.slice(0, 4) : [{ emoji: '🌍', label: 'Explorer' }];
}

function showBlend() {
  addAjorinMessage("Okay okay, I've got a read on you now. Drumroll...", () => {
    const blend = computeBlend();
    const wrap = document.createElement('div');
    wrap.className = 'msg msg-ajorin';
    wrap.style.maxWidth = '95%';
    wrap.innerHTML = `<span class="msg-name">Ajorin</span><div class="blend-row">${blend.map(b => `<div class="blend-chip"><span class="blend-emoji">${b.emoji}</span><span class="blend-lbl">${b.label}</span></div>`).join('')}</div>`;
    chatScroll.appendChild(wrap);
    scrollChatToBottom();

    setTimeout(() => {
      if (isEditing) {
        addAjorinMessage("This isn't set in stone — you'll shape it more the second you start exploring again. Let's save these updates.", showEditSaveForm);
      } else {
        addAjorinMessage("This isn't set in stone — you'll shape it more the second you start actually exploring. Let's save this before I forget everything (kidding, I don't forget — but let's save it anyway).", showSignupForm);
      }
    }, 1000);
  });
}

function showSignupForm() {
  const wrap = document.createElement('div');
  wrap.className = 'msg msg-ajorin';
  wrap.style.maxWidth = '95%';
  wrap.innerHTML = `
    <span class="msg-name">Ajorin</span>
    <p style="margin-bottom:0.7rem;">Let's make this official.</p>
    <div class="form-box">
      <input class="form-input" id="signupName" placeholder="Your name">
      <input class="form-input" id="signupEmail" placeholder="Your email">
      <input class="form-input" id="signupPassword" type="password" placeholder="Create a password">
      <p class="form-error" id="formError">Just need a name, a real email, and a password of at least 6 characters 🙂</p>
      <button class="form-submit" id="signupSubmit">Create My Account →</button>
    </div>
  `;
  chatScroll.appendChild(wrap);
  scrollChatToBottom();

  document.getElementById('signupSubmit').onclick = async () => {
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const errorEl = document.getElementById('formError');
    const btn = document.getElementById('signupSubmit');

    if (!name || !email || !email.includes('@') || password.length < 6) {
      errorEl.style.display = 'block';
      return;
    }
    errorEl.style.display = 'none';
    btn.textContent = 'Creating your account...';
    btn.disabled = true;

    try {
      const { error: authError } = await sbClient.auth.signUp({ email, password });
      if (authError) {
        errorEl.textContent = authError.message || 'Something went wrong creating your account.';
        errorEl.style.display = 'block';
        btn.textContent = 'Create My Account →';
        btn.disabled = false;
        return;
      }

      const { error: profileError } = await sbClient.from('profiles').insert({
        email: email,
        name: name,
        cultures: answersByField.cultures || '',
        interests: answersByField.interests || '',
        pace: answersByField.pace || '',
        food: answersByField.food || '',
        dietary: answersByField.dietary || '',
        culture_draw: answersByField.culture_draw || '',
        social: answersByField.social || '',
        planning_style: answersByField.planning_style || '',
        budget: answersByField.budget || '',
        wants_community: answersByField.wants_community || ''
      });

      if (profileError) console.error('Profile save failed:', profileError);

      addYouMessage(`${name} — account created ✓`);
      setTimeout(showFinish, 500);
    } catch (err) {
      console.error('Sign-up failed:', err);
      errorEl.textContent = 'Something went wrong. Please try again.';
      errorEl.style.display = 'block';
      btn.textContent = 'Create My Account →';
      btn.disabled = false;
    }
  };
}

function showEditSaveForm() {
  const wrap = document.createElement('div');
  wrap.className = 'msg msg-ajorin';
  wrap.innerHTML = `<span class="msg-name">Ajorin</span><button class="final-btn" id="editSaveBtn">Save My Updates →</button>`;
  chatScroll.appendChild(wrap);
  scrollChatToBottom();

  document.getElementById('editSaveBtn').onclick = async () => {
    const btn = document.getElementById('editSaveBtn');
    btn.textContent = 'Saving...';
    btn.disabled = true;

    try {
      const { data: { session } } = await sbClient.auth.getSession();
      if (!session) { window.location.href = 'onboarding.html'; return; }

      const { error } = await sbClient.from('profiles').update({
        cultures: answersByField.cultures || '',
        interests: answersByField.interests || '',
        pace: answersByField.pace || '',
        food: answersByField.food || '',
        dietary: answersByField.dietary || '',
        culture_draw: answersByField.culture_draw || '',
        social: answersByField.social || '',
        planning_style: answersByField.planning_style || '',
        budget: answersByField.budget || '',
        wants_community: answersByField.wants_community || ''
      }).eq('email', session.user.email);

      if (error) console.error('Update failed:', error);
      window.location.href = 'dashboard.html';
    } catch (err) {
      console.error('Save failed:', err);
      btn.textContent = 'Something went wrong — try again';
      btn.disabled = false;
    }
  };
}

function showFinish() {
  addAjorinMessage("Perfect. You're officially in the system. Let's go find you somewhere good.", () => {
    const wrap = document.createElement('div');
    wrap.className = 'msg msg-ajorin';
    wrap.innerHTML = `<span class="msg-name">Ajorin</span><a href="dashboard.html" class="final-btn">Explore Now →</a>`;
    chatScroll.appendChild(wrap);
    scrollChatToBottom();
  }, 700);
}

function showSigninOverlay() {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'signinOverlay';
  overlay.innerHTML = `
    <div class="overlay-box">
      <div class="overlay-title">Welcome back</div>
      <div class="form-box">
        <input class="form-input" id="signinEmail" placeholder="Your email">
        <input class="form-input" id="signinPassword" type="password" placeholder="Your password">
        <p class="form-error" id="signinError">Couldn't sign in — check your email and password.</p>
        <button class="form-submit" id="signinSubmit">Sign In →</button>
        <button class="overlay-close" onclick="document.getElementById('signinOverlay').remove()">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('signinSubmit').onclick = async () => {
    const email = document.getElementById('signinEmail').value.trim();
    const password = document.getElementById('signinPassword').value;
    const errorEl = document.getElementById('signinError');
    const btn = document.getElementById('signinSubmit');
    btn.textContent = 'Signing in...';
    btn.disabled = true;

    try {
      const { error } = await sbClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = error.message || "Couldn't sign in — check your email and password.";
        errorEl.style.display = 'block';
        btn.textContent = 'Sign In →';
        btn.disabled = false;
        return;
      }
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorEl.style.display = 'block';
      btn.textContent = 'Sign In →';
      btn.disabled = false;
    }
  };
}

async function initOnboarding() {
  if (isEditing) {
    document.getElementById('signinToggle').style.display = 'none';
    addAjorinMessage(questions[0].text, () => renderQuickReplies(questions[0]));
    return;
  }

  const { data: { session } } = await sbClient.auth.getSession();
  if (session) {
    window.location.href = 'dashboard.html';
    return;
  }

  addAjorinMessage(questions[0].text, () => renderQuickReplies(questions[0]));
}

initOnboarding();
</script>
